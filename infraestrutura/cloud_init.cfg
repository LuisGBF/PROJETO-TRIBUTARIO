#cloud-config
hostname: ${nome_vm}
manage_etc_hosts: true
users:
- name: ${usuario}
gecos: Usuario de administracao do pipeline


groups: [sudo]
shell: /bin/bash
sudo: ALL=(ALL) NOPASSWD:ALL
lock_passwd: true
ssh_authorized_keys:
- ${ssh_public_key}
ssh_pwauth: false
disable_root: true
package_update: true
packages:
- qemu-guest-agent
- python3
runcmd:
- systemctl enable --now qemu-guest-agent
- echo "cloud-init aplicado em $(date -Iseconds)" > /var/log/cloud-init-
pipeline.log

final_message: "VM pronta apos $UPTIME segundos"
