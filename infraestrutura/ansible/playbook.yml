---
- name: Preparar ambiente de execução do simulador
  hosts: simulador
  become: true

  vars:
    usuario_app: pipeline
    dir_app: /opt/simulador
    dir_venv: /opt/simulador/venv
    dir_dados: /var/lib/simulador/dados
    dir_logs: /var/log/simulador

  tasks:
    - name: Atualizar cache de pacotes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar Python e ferramentas de ambiente virtual
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present

    - name: Criar diretórios da aplicação, dos dados e dos logs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ usuario_app }}"
        group: "{{ usuario_app }}"
        mode: "0755"
      loop:
        - "{{ dir_app }}"
        - "{{ dir_dados }}"
        - "{{ dir_logs }}"

    - name: Copiar lista de dependências do simulador
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../simulador/requirements.txt"
        dest: "{{ dir_app }}/requirements.txt"
        owner: "{{ usuario_app }}"
        group: "{{ usuario_app }}"
        mode: "0644"

    - name: Criar ambiente virtual e instalar bibliotecas
      become_user: "{{ usuario_app }}"
      ansible.builtin.pip:
        requirements: "{{ dir_app }}/requirements.txt"
        virtualenv: "{{ dir_venv }}"
        virtualenv_command: python3 -m venv
